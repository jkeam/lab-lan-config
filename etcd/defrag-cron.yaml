apiVersion: v1
kind: Namespace
metadata:
  name: etcd-defrag
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-defrag
  namespace: etcd-defrag
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etcd-defrag
  namespace: openshift-etcd
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etcd-defrag
  namespace: openshift-etcd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: etcd-defrag
subjects:
  - kind: ServiceAccount
    name: etcd-defrag
    namespace: etcd-defrag
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-defrag
  namespace: etcd-defrag
spec:
  schedule: "0 3 * * 0"            # Sundays 03:00
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: etcd-defrag
          restartPolicy: Never
          containers:
            - name: defrag
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              command:
                - /bin/bash
                - -c
                - |
                  oc exec -n openshift-etcd -c etcdctl \
                    "$(oc get pods -n openshift-etcd -l app=etcd -o name | head -n1)" -- \
                    sh -c 'unset ETCDCTL_ENDPOINTS; etcdctl --command-timeout=60s --endpoints=https://localhost:2379 defrag'
