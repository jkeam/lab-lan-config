apiVersion: v1
kind: PersistentVolume
metadata:
  name: httpd-data-pv
  namespace: httpd-server
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  local:
    path: /dev/nvme0n1
  resources:
    requests:
      storage: 100Gi
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - master1
  claimRef:
    name: httpd-data-pvc
    namespace: httpd-server
