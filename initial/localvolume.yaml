apiVersion: "local.storage.openshift.io/v1"
kind: "LocalVolume"
metadata:
  name: "local-disks"
  namespace: "openshift-local-storage" 
spec:
  nodeSelector: 
    nodeSelectorTerms:
    - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - master1
          - workerbee1
  storageClassDevices:
    - storageClassName: "local-sc" 
      forceWipeDevicesAndDestroyAllData: true
      # volumeMode: Filesystem or Block are valid
      volumeMode: Block
      # fsType is only needed for volumeMode: Filesystem
      # fsType: xfs 
      devicePaths: 
        - /dev/nvme0n1
