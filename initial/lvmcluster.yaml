apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: lvmcluster
  namespace: openshift-lvm-storage
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    storageclass.kubevirt.io/is-default-virt-class: "true"
spec:
  storage:
    deviceClasses:
      - name: vg1
        fstype: ext4
        default: true
        nodeSelector:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
              - master1
              - workerbee1
        deviceSelector:
          optionalPaths:
          - /dev/disk/by-id/nvme-KINGSTON_SNV2S2000G_50026B7686A14EA2
          - /dev/disk/by-id/nvme-512GB_SSD_MQ25W03121871
          forceWipeDevicesAndDestroyAllData: true
        thinPoolConfig:
          chunkSizeCalculationPolicy: Static
          metadataSizeCalculationPolicy: Host
          sizePercent: 90
          name: thin-pool-1
          overprovisionRatio: 10
