apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: physnet-vmdata
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: vms
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: physnet-vmdata
      subnets:
        - "192.168.1.0/24"

