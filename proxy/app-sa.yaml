apiVersion: v1
kind: ServiceAccount
metadata:
  name: privileged-proxy-web-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-anyuid-to-privileged-proxy-web-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid 
subjects:
- kind: ServiceAccount
  name: privileged-proxy-web-sa
