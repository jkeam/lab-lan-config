apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: all-basic-role
  namespace: proxy
rules:
- apiGroups: [""]
  resources: ["serviceaccounts", "services", "secrets", "configmaps"]
  verbs: ["*"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: all-basic-argocd-binding
  namespace: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: all-basic-role
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: all-deployment-role
  namespace: proxy
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["*"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: all-deployment-argocd-binding
  namespace: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: all-deployment-role
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: all-route-role
  namespace: proxy
rules:
- apiGroups: ["route.openshift.io"]
  resources: ["routes", "routes/custom-host"]
  verbs: ["*"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: all-route-argocd-binding
  namespace: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: all-route-role
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
