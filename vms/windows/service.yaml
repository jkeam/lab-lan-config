apiVersion: v1
kind: Service
metadata:
  name: win10-service
  namespace: vms
  annotations:
    metallb.universe.tf/address-pool: windows-ip-addresspool
spec:
  selector:
    app: win10
  ports:
  - name: rdp
    port: 3389
    targetPort: 3389
    protocol: TCP
  type: LoadBalancer
  loadBalancerIP: 192.168.1.204
